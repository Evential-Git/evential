<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://myptrikcoblkypdnpekb.supabase.co; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#0B1B4D">
  <title>Unsubscribe | Evential</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/evential.css">
  <link rel="stylesheet" href="/unsubscribe.css">
  <!-- No analytics or third-party assets on this private preference page. -->
</head>
<body>
  <header class="unsubscribe-header"><a href="/" class="nav-logo" aria-label="Evential home">EVENTIAL</a></header>
  <main class="unsubscribe-card">
    <span class="eyebrow">Email preferences</span>
    <h1 id="unsubscribe-heading">Unsubscribe from Evential updates</h1>
    <p id="unsubscribe-description">Confirm below to stop receiving our mailing-list emails. No sign-in is needed.</p>
    <form id="unsubscribe-form" hidden>
      <button class="btn btn-primary" type="submit">Unsubscribe</button>
    </form>
    <p id="unsubscribe-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Enable JavaScript to unsubscribe here, or email <a href="mailto:contact@evential.co?subject=Unsubscribe">contact@evential.co</a> with your request.</p></noscript>
    <p class="unsubscribe-help">Need help? Email <a href="mailto:contact@evential.co?subject=Unsubscribe">contact@evential.co</a>.</p>
    <a class="unsubscribe-home" href="/">Return to Evential</a>
  </main>
  <script src="/mailing-list-config.js" defer></script>
  <script src="/unsubscribe.js" defer></script>
</body>
</html>
